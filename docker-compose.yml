name: mispisit-vasileva

services:
  app:
    image: gitverse.ru/leiasqq/mispisit-lab1:0.0.3
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: Host=db;Port=5432;Database=app;Username=app;Password=app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dbdata: